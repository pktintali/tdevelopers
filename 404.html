<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — TDevelopers</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0b0e" />
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(60rem 40rem at 20% 10%, rgba(220,20,20,0.10), transparent 60%),
        #08080a;
      color: #fff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .num {
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(7rem, 22vw, 14rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.25) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .num span { color: #ef2b2b; -webkit-text-fill-color: #ef2b2b; }
    h1 {
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      letter-spacing: -0.02em;
      margin: 1rem 0 0.5rem;
    }
    p { color: rgba(255,255,255,0.6); max-width: 32rem; margin: 0 auto 2rem; line-height: 1.6; }
    a {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.85rem 1.4rem; border-radius: 999px;
      background: #fff; color: #08080a; text-decoration: none;
      font-weight: 600; font-size: 0.95rem;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -10px rgba(220,20,20,0.4); }
    a span { display: inline-flex; height: 1.6rem; width: 1.6rem; align-items: center; justify-content: center; border-radius: 999px; background: #ef2b2b; color: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="num">4<span>0</span>4</div>
    <h1>This page doesn't exist.</h1>
    <p>The link might be broken or the page may have moved. Let's get you back.</p>
    <a href="/">
      Back home
      <span>→</span>
    </a>
  </main>
</body>
</html>
